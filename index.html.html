<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسمية المركبات التناسقية – سمنار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ac:#22c7d6;--gold:#f5b83d;--tx:#eef4ff;--mut:#a9bbd8;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#06101f;color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;transform:translate(-50%,-50%)}
#gl{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
.s{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .5s,visibility .5s}
.s.a{visibility:visible;opacity:1}
.tx{position:absolute;right:56px;top:34px;width:700px;height:596px;font-size:var(--fs,24px);line-height:1.55;overflow:hidden}
.s.b .tx{position:static;width:auto;height:auto;padding:34px 56px 0;overflow:visible}
.s.a .tx>*{animation:in .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.09s)}
@keyframes in{from{opacity:0;transform:translateX(70px) rotateY(28deg)}to{opacity:1;transform:none}}
h2{font-size:1.7em;font-weight:800;margin:0 0 .3em;display:flex;align-items:center;gap:.5em}h2 em{font-style:normal;background:linear-gradient(90deg,#fff 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
h2 span{background:linear-gradient(135deg,#ffd36b,#f08a1c);color:#14213a;-webkit-text-fill-color:#14213a;font-size:.6em;min-width:1.9em;height:1.9em;border-radius:.6em;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(245,184,61,.5)}
p{margin:.3em 0}
ul{margin:.2em 0;padding-inline-start:1.2em}li{margin:.2em 0}li::marker{color:var(--ac)}
b{color:#fff}
.f{direction:ltr;unicode-bidi:isolate;display:inline-block;color:var(--ac);font-weight:700;font-family:'Segoe UI',Arial,sans-serif}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Segoe UI',Arial,sans-serif;color:#fff}
.box{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:.35em .9em;margin:.45em 0;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.box.g{border-color:rgba(245,184,61,.65);box-shadow:0 0 22px rgba(245,184,61,.15)}
table{width:100%;border-collapse:separate;border-spacing:0 .2em;font-size:.82em}
th{background:rgba(245,184,61,.2);color:var(--gold);padding:.25em .4em;font-weight:700}
th:first-child,td:first-child{border-radius:0 10px 10px 0}th:last-child,td:last-child{border-radius:10px 0 0 10px}
td{background:rgba(255,255,255,.07);padding:.22em .4em;text-align:center;word-break:break-word}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 .8em}
.hint{font-size:.7em;color:var(--mut)}
.chips{display:grid;grid-template-columns:repeat(4,auto);gap:.4em;justify-content:start}
.chip{padding:.25em .8em;border-radius:12px;font-size:.62em;font-weight:600;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:inset -3px 0 0 var(--ac);white-space:nowrap}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:.5em}
.hd img{height:84px;border-radius:12px;box-shadow:0 0 24px rgba(0,0,0,.4)}
.hd .seal{border-radius:50%;box-shadow:0 0 28px rgba(245,184,61,.5)}
.hd div{line-height:1.35}.hd small{display:block;color:var(--ac);font-size:.7em}
.sem{color:var(--gold);font-weight:800;letter-spacing:.1em}
.big{font-size:2.5em;font-weight:800;line-height:1.2;margin:.1em 0;background:linear-gradient(90deg,#fff,var(--ac) 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.line{width:130px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--ac));margin:.5em 0}
.pn{display:flex;align-items:center;gap:.6em;padding:.18em .6em;margin:.22em 0;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-weight:600}
.pn i{width:1.7em;height:1.7em;border-radius:50%;background:linear-gradient(135deg,#ffd36b,#f08a1c);color:#14213a;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:800}
.gcs{position:absolute;left:0;right:0;bottom:78px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:21px;line-height:1.4}
.gcs b{color:var(--gold);font-size:1.15em;display:block}
#ui{position:absolute;left:36px;right:36px;bottom:12px;height:44px;display:flex;align-items:center;gap:10px;z-index:9}
#ui button{width:48px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(6px)}
#ui button:hover{background:rgba(255,255,255,.22)}
#ft{flex:1;text-align:center;color:var(--mut);font-size:14px}
#cnt{direction:ltr;color:var(--mut);font-size:15px;min-width:56px;text-align:center}
#pg{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--gold));width:0;transition:width .6s}
#rot{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(245,184,61,.95);color:#14213a;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;display:none;z-index:20}
#rot{display:none!important}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="rot">📱 أدِر الهاتف أفقياً لعرض أفضل</div>
<div id="stage">
<canvas id="gl" width="1280" height="720"></canvas>
<div id="deck"></div>
<div id="ui"><button id="pv" title="السابق">▶</button><button id="pl" title="تشغيل تلقائي">⏵</button><button id="nx" title="التالي">◀</button><span id="ft">تسمية المركبات التناسقية | جامعة العين العراقية | قسم الكيمياء</span><span id="cnt"></span><button id="fs" title="ملء الشاشة">⛶</button></div>
<div id="pg"></div>
</div>
